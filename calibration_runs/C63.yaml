#========================================================================================
# calibration_runs/C63.yaml
#
# This run declares no outputs section of its own -- it uses
# config/framework.yaml's default outputs.include/max_file_size_mb, which is
# built from tdm/2_ModelScripts/_Python/pp_ValidationDocumentation.py's own
# copy_files list (the TDM's existing, working post-processing step, which
# normally copies these same raw files into WF-TDM-Documentation -- this
# repo's own pipeline never runs that script itself, see
# config/framework.yaml's scenario_folder_template comment, but its
# copy_files list is still the best record of where the TDM actually writes
# each file within a run's working folder).
#========================================================================================
calib_run_id: C63
author: ""
description: >
  Calibration iteration C63, base year 2023. Tests new calibFac_cap_ArtColLoc
  TDM factor (0.95, 5%) (feature/cap-calib-factor, calib/C63 -- mirrors the
  existing calibFac_ff_spd_* mechanism but for capacity/CAP1HR1LN) to test
  whether arterial/collector/local capacity, not just free-flow speed, needs
  to come down to better validate congested PM peak travel times.
  calibFac_cap_ExpwyFwy left at 1.0 -- no freeway/expressway capacity test
  this run, ArtColLoc only. 5% chosen as a conservative first test of this
  brand-new lever: arterial/collector/local links use much lower BPR
  exponents (3-4) than expressway/freeway (6-8), so the same % cut produces a
  much smaller delay response there, following the same conservative-first
  approach as calibFac_ff_spd_ExpwyFwy (0.95 in C61 before 0.9 in C62). Speed
  factors (calibFac_ff_spd_ArtColLoc/ExpwyFwy) reset to 1.0 so this run
  isolates the capacity effect rather than confounding it with the speed
  reduction carried in C62. Otherwise carries forward C62's calibration
  factors unchanged.

tdm_ref: "calib/C63"
baseline_control_center: "_ControlCenter - BY_2023.block"

driver_script: "__HailMary_resumable.s"

start_at_label: "STEP0"

control_center_overrides:
  UserName: "Bill Hereth"
  UserCompany: "WFRC"
  keyOutputPrfx: "_"

# calibFac_LT_*/calibFac_MD_*/calibFac_HV_* and the truck-cost/ramp-penalty
# factors below are GeneralParameters.block keys (tdm/1_Inputs/0_GlobalData/),
# not Control Center keys -- a separate override mechanism, since
# GeneralParameters.block is shared across every calibration run's working
# folder rather than templated per run (see src/tdmcalib/general_parameters.py).

general_parameter_overrides:
  calibFac_LT_BE: 1.15
  calibFac_LT_WE: 1.15
  calibFac_LT_DA: 1.06
  calibFac_LT_SL: 1.00
  calibFac_LT_UT: 1.00
  calibFac_MD_BE: 0.75
  calibFac_MD_WE: 0.67
  calibFac_MD_DA: 3.00
  calibFac_MD_SL: 0.87
  calibFac_MD_UT: 1.20
  calibFac_HV_BE: 2.93
  calibFac_HV_WE: 2.27
  calibFac_HV_DA: 1.50
  calibFac_HV_SL: 3.00
  calibFac_HV_UT: 0.89
  DA_FwyTruckCostFac   : 1.30 # rever to C51 values since final assign fixed to include truck cost in C56
  DA_NonFwyTruckCostFac: 0.75
  DA_RampTruckPenAdd   : 1.25
  SL_FwyTruckCostFac   : 1.10
  SL_NonFwyTruckCostFac: 0.95
  SL_RampTruckPenAdd   : 0.25
  calibFac_Ext_PL_3604: 1.50 # I-15 Box Elder
  calibFac_Ext_MD_3604: 1.05
  calibFac_Ext_HV_3604: 1.15
  calibFac_Ext_PL_3609: 1.20 # I-84 Morgan
  calibFac_Ext_MD_3609: 1.20
  calibFac_Ext_HV_3609: 1.20
  calibFac_Ext_PL_3612: 1.05 # I-80 Tooele
  calibFac_Ext_MD_3612: 1.05
  calibFac_Ext_HV_3612: 1.05
  calibFac_Ext_PL_3614: 1.05 # I-80 Summit
  calibFac_Ext_MD_3614: 1.05
  calibFac_Ext_HV_3614: 1.05
  calibFac_Ext_PL_3620: 1.10 # Provo Canyon
  calibFac_Ext_MD_3620: 1.10
  calibFac_Ext_HV_3620: 1.10
  calibFac_Ext_PL_3628: 1.20 # I-15 Juab
  calibFac_Ext_MD_3628: 1.15
  calibFac_Ext_HV_3628: 1.10
  calibFac_ff_spd_ArtColLoc: 1.0 # reset to 1.0 (was 0.9 in C62) -- C63 isolates the new capacity factor, no speed reduction this run
  calibFac_ff_spd_ExpwyFwy: 1.0  # reset to 1.0 (was 0.9 in C62) -- C63 isolates the new capacity factor, no speed reduction this run
  #RampPenWeight: 2.50  # too high volume for freeways, so increase ramp penalty weight to reduce freeway volumes and increase arterial volumes
  #CALIB_MC: 1.0 # don't run mode choice calibration
  #calibFac_mc_transit_share: 1.23
  calibFac_cap_ArtColLoc: 0.95 # NEW (calib/C63): 5% capacity reduction on arterial/collector/local roads (FT 2-7) -- conservative first test, low BPR exponents (3-4) here vs freeway
  calibFac_cap_ExpwyFwy: 1.0   # NEW (calib/C63): left at 1.0 -- no freeway/expressway capacity test this run, ArtColLoc only


# No outputs section: this run's raw output matches the raw TDM Scenario
# folder layout, so it uses config/framework.yaml's default outputs.include
# (and default max_file_size_mb) as-is.
