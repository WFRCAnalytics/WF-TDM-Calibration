#========================================================================================
# config/framework.yaml
#
# Global, repo-wide settings. Per-calibration-run values never belong here --
# this file should change rarely (new TDM version conventions, a new default
# size limit), not per calibration iteration.
#========================================================================================

# Path to the TDM git submodule, relative to the repository root.
tdm_submodule_path: "tdm"

# Path to the Control Center defaults library, relative to the submodule root.
# calibration_runs/*.yaml `baseline_control_center` values are filenames
# resolved against this directory.
control_center_defaults_dir: "Scenarios/_default"

# Path to the TDM's GeneralParameters.block, relative to the submodule root --
# the file the driver script's own `READ FILE = '..\..\1_Inputs\0_GlobalData\
# GeneralParameters.block'` line resolves to, same for every calibration
# run's working folder (see general_parameters.py for why this makes it a
# different override mechanism from the per-run Control Center). Only read to
# validate calibration_runs/*.yaml `general_parameter_overrides` keys against
# what the file actually defines -- never copied or modified.
general_parameters_path: "1_Inputs/0_GlobalData/GeneralParameters.block"

# Convention for where a calibration run's working folder is created, relative
# to the submodule root. Available placeholder: {calib_run_id}.
#
# Deliberately excludes {run_id}: raw model outputs are too large to
# duplicate on every attempt, so re-running a calibration run reuses the same
# on-disk folder and lets Cube overwrite files in place. Likewise,
# runs/{calib_run_id}/run_metadata.json (the curated, committed side) keeps
# only the latest attempt -- a new run replaces it rather than adding another
# one alongside.
#
# Every calibration run declares its own driver_script (required by
# calibration_run.schema.json -- there is no framework-wide default here, so
# which driver script ran is always explicit in the run's own config). A
# bare-filename driver_script value is resolved against
# control_center_defaults_dir below and must be __HailMary.s or a variant
# shipped alongside it (e.g. __HailMary_resumable.s), not
# __HailMary_1Subfolder.s or __HailMary_1Subfolder_withValidationDoc.s: those
# two variants' READ FILE paths are '..\..\..\1_Inputs\...' (three levels up
# to the tdm/ root), which assumes an extra folder level (e.g.
# Scenarios/{group}/{run}/) that this template ("Scenarios/{calib_run_id}",
# only two levels below tdm/) doesn't have -- confirmed by a live C50 run
# failing at the very first READ FILE step (VOYAGER ReturnCode=2, "cannot
# find the path specified") until switched to __HailMary.s, whose paths are
# '..\..\...' (two levels up), matching this template exactly. The
# _withValidationDoc variant would also additionally run
# GenerateDocumentation.s (gated by Run_Documentation=1 in the baseline),
# wired to WF-TDM-Documentation's folder/sidebar conventions
# (DocumentationDir, ValidationQmdDir, _quarto-website.yml) -- this repo's
# own tdmcalib output curation (outputs.py) + report/ Quarto reports are the
# reporting path here instead.
scenario_folder_template: "Scenarios/{calib_run_id}"

# The fixed batch entry point and how the orchestrator invokes it. Kept as
# config (not hardcoded) since the calling convention is a property of the TDM
# version, not of this framework. {control_center_path} and {scenario_folder}
# are filled in by the orchestrator for each run.
#
# Path is resolved relative to this repo's root (not the tdm/ submodule) --
# this entry point belongs to the framework, not to any one TDM version.
# Cube Voyager's install location is machine-local, not baked in here -- it's
# read from config/local.yaml's Voyager_EXE and passed through as the
# VOYAGER_EXE environment variable (see execution.invoke()).
execution:
  entry_point: "bin/RunModel.bat"
  args: ["{control_center_path}", "{scenario_folder}"]
  timeout_seconds: 86400

# Output curation defaults, shared across calibration runs.
#
# max_file_size_mb: an individual calibration run's config may override this,
# but never above this hard ceiling.
#
# include: the default curation list, matching the raw TDM Scenario folder
# layout (0_InputProcessing/, 1_HHDisag_AutoOwn/, 3_Distribute/,
# 4_ModeChoice/, 5_AssignHwy/) that a live `tdmcalib run` produces -- see
# tdm/2_ModelScripts/_Python/pp_ValidationDocumentation.py's copy_files list,
# whose *source* paths are this same raw layout (its *destination* paths are
# a differently-named staging layout used only for WF-TDM-Documentation
# renders, which this repo's pipeline never runs). A calibration run only
# needs its own outputs.include when its raw output doesn't match this raw
# layout -- e.g. calibration_runs/C33.yaml, imported from an archive of that
# staging layout rather than a live run's raw output.
outputs:
  max_file_size_mb: 95
  include:
    - datafile: "0_InputProcessing/SE_File.dbf"
    - datafile: "1_HHDisag_AutoOwn/Joint_HHSize_Income_Worker.dbf"
    - datafile: "1_HHDisag_AutoOwn/VO_HHSize_VehOwn.dbf"
    - datafile: "1_HHDisag_AutoOwn/VO_HH1_IncLoHi_Worker_VehOwn.dbf"
    - datafile: "1_HHDisag_AutoOwn/VO_HH2_IncLoHi_Worker_VehOwn.dbf"
    - datafile: "1_HHDisag_AutoOwn/VO_HH3_IncLoHi_Worker_VehOwn.dbf"
    - datafile: "1_HHDisag_AutoOwn/VO_HH4_IncLoHi_Worker_VehOwn.dbf"
    - datafile: "1_HHDisag_AutoOwn/VO_HH5_IncLoHi_Worker_VehOwn.dbf"
    - datafile: "1_HHDisag_AutoOwn/VO_HH6_IncLoHi_Worker_VehOwn.dbf"
    - datafile: "3_Distribute/pa_final.csv"
    - datafile: "3_Distribute/SumToDistricts/DISTLRG_PA_Gravity_AllPurp.csv"
    - datafile: "3_Distribute/TLF/TLF_Cost.csv"
    - datafile: "3_Distribute/TLF/TLF_Dist.csv"
    - datafile: "3_Distribute/TLF/TLF_Time.csv"
    - datafile: "4_ModeChoice/5_DistrictSummary/DISTLRG_PA_AllPurp.csv"
    - datafile: "4_ModeChoice/2_DetailedTripMatrices/IMZ_TripTotals.csv"
    - datafile: "4_ModeChoice/3_TransitAssign/_transit_brding_summary_node.csv"
    - datafile: "4_ModeChoice/3_TransitAssign/_transit_rider_summary_link.csv"
    - datafile: "4_ModeChoice/4_Shares/*RegionShares_Ok.csv"
    - datafile: "4_ModeChoice/4_Shares/*RegionShares_Pk.csv"
    - datafile: "5_AssignHwy/4_Summaries/*Summary_SEGID.csv"
    - datafile: "5_AssignHwy/4_Summaries/*Summary_SEGID_Detailed.csv"
    - datafile: "5_AssignHwy/4_Summaries/*Summary_Screenline.csv"
    - datafile: "Temp/5_AssignHwy/Screenline_Segment_Lookup.csv"
    # Matrix conversions (Cube .MTX -> .omx). source_format defaults to "mtx"
    # (Cube's native format, the real Scenarios/{calib_run_id}/ working
    # folder's actual output) -- requires config/local.yaml's Voyager_EXE to
    # be set at curation time. format is the destination format written to
    # runs/; explicit here even though "omx" is also the default, so intent
    # isn't left implicit.
    # Person-trip purposes plus everything report/preprocess/distribution.py's
    # TRUCK_MATS/EXT_MATS pull for the Trip Length Frequency Validation chart's
    # Commercial Vehicle Purposes / External Purposes selectors (previously
    # only the 8 person purposes were curated, so those selectors' Model side
    # was silently all-zero -- the raw .mtx always had these tabs, they just
    # never made it into the curated .omx). II_MD_Adj/II_HV_Adj aren't listed
    # -- the model's own output has no such tabs to select (they're a
    # calibration-factor artifact of the static observed/target comparison
    # file only), and XX/XX_MD/XX_HV aren't pulled by any current report page.
    - matrix: "3_Distribute/PA_AllPurp_GRAVITY.MTX"
      tabs: [
        HBW, HBShp, HBOth, HBSch_Pr, HBSch_Sc, HBC, NHBW, NHBNW,
        II_LT, II_MD, II_HV,
        II_LT_D2D, II_LT_HnS, II_LT_Lcl, II_LT_Reg, II_LT_LHl, II_LT_Unk,
        II_MD_D2D, II_MD_HnS, II_MD_Lcl, II_MD_Reg, II_MD_LHl, II_MD_Unk,
        II_HV_D2D, II_HV_HnS, II_HV_Lcl, II_HV_Reg, II_HV_LHl, II_HV_Unk,
        IX, XI, IX_MD, XI_MD, IX_HV, XI_HV
      ]
      format: omx
    - matrix: "3_Distribute/skm_DY_GC.MTX"
      tabs: [HBW, HBShp, HBOth, NHBW, NHBNW, HBS, LT, MD, HV, Ext]
      format: omx
    - matrix: "3_Distribute/skm_DY_Dist.MTX"
      tabs: [HBW, HBShp, HBOth, NHBW, NHBNW, HBS, LT, MD, HV, Ext]
      format: omx
    - matrix: "5_AssignHwy/5_FinalNetSkims/Skm_AM.MTX"
      tabs: [GP_Dist, GP_IVT]
      format: omx
    - matrix: "5_AssignHwy/5_FinalNetSkims/Skm_MD.MTX"
      tabs: [GP_Dist, GP_IVT]
      format: omx
    - matrix: "5_AssignHwy/5_FinalNetSkims/Skm_PM.MTX"
      tabs: [GP_Dist, GP_IVT]
      format: omx
    - matrix: "5_AssignHwy/5_FinalNetSkims/Skm_EV.MTX"
      tabs: [GP_Dist, GP_IVT]
      format: omx
    - matrix: "Temp/4_ModeChoice/pa_HBW_0veh_hi.MTX"
      tabs: [trips]
      format: omx
    - matrix: "Temp/4_ModeChoice/pa_HBW_0veh_lo.MTX"
      tabs: [trips]
      format: omx
    - matrix: "Temp/4_ModeChoice/pa_HBW_1veh_hi.MTX"
      tabs: [trips]
      format: omx
    - matrix: "Temp/4_ModeChoice/pa_HBW_1veh_lo.MTX"
      tabs: [trips]
      format: omx
    - matrix: "Temp/4_ModeChoice/pa_HBW_2veh_hi_noXI.MTX"
      tabs: [trips]
      format: omx
    - matrix: "Temp/4_ModeChoice/pa_HBW_2veh_lo_noXI.MTX"
      tabs: [trips]
      format: omx
    - matrix: "4_ModeChoice/2_DetailedTripMatrices/AllTrips_Pk.MTX"
      tabs: [wCRT, dCRT]
      format: omx
    - matrix: "4_ModeChoice/2_DetailedTripMatrices/AllTrips_Ok.MTX"
      tabs: [wCRT, dCRT]
      format: omx
    - matrix: "4_ModeChoice/1a_Skims/skm_w8_Pk.MTX"
      tabs: [D8]
      format: omx
    - matrix: "4_ModeChoice/1a_Skims/skm_w8_Ok.MTX"
      tabs: [D8]
      format: omx
    - matrix: "4_ModeChoice/1a_Skims/skm_d8_Pk.MTX"
      tabs: [D8]
      format: omx
    - matrix: "4_ModeChoice/1a_Skims/skm_d8_Ok.MTX"
      tabs: [D8]
      format: omx

# Run metadata schema version this version of the framework writes. Bump this,
# and add a migration note, if the metadata shape changes.
run_metadata_schema_version: 1

# Post-run report rendering. When enabled, a successful run() or
# import_manual_run() automatically re-renders the report/ Quarto project so
# it reflects this run's output -- replacing the old manual "preprocess"
# toggle that report/config.json used to gate (see report/README.md). A
# rendering failure is recorded on the run's metadata but never fails the
# run itself -- outputs are already safely curated regardless.
postprocess:
  render_validation: true
  quarto_exe: "quarto"
  timeout_seconds: 3600
