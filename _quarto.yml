project:
  type: website
  output-dir: docs
  # Explicit path needed for correct resolution outside the extension's own
  # dev project -- see _extensions/WFRCAnalytics/wfrc-brand/README notes.
  brand: _extensions/WFRCAnalytics/wfrc-brand/brand.yml
  render:
    - "index.qmd"
    - "report/**/*.qmd"

# wfrc-brand's _extension.yml only auto-contributes HTML/Typst/DOCX format
# options (theme, fonts, toc, layout) -- footer/navbar/social defaults live in
# wfrc-shared.yml. NOT imported via `metadata-files:` here: testing showed
# metadata-files values win over this file's own direct settings (opposite of
# what the extension's docs imply), which would have silently swapped this
# project's `jupyter: wftdm-docs` kernel for the extension's `jupyter: python3`
# preview-page default. So the pieces we want are copied in by hand below
# instead, leaving nothing that can override the execution settings.
website:
  title: "WF-TDM Calibration"
  site-url: "https://wfrcanalytics.github.io/WF-TDM-Calibration/"
  page-navigation: true
  back-to-top-navigation: false
  twitter-card:
    creator: "@wasatchcouncil"
    site: "@wasatchcouncil"
    card-style: summary_large_image
  open-graph: true
  cookie-consent: false
  sidebar:
    style: docked
    search: false
    contents:
      - index.qmd
      - section: "Reports"
        contents:
          - report/0-hhdisag-autoown.qmd
          - report/1-tripgen.qmd
          - report/2-distribution.qmd
          - report/3-modechoice.qmd
          - report/4-assignhwy.qmd
      - report/compare.qmd
  navbar:
    logo-alt: "Wasatch Front Regional Council"
    right:
      - text: Follow Us
        menu:
          - icon: facebook
            text: Facebook
            href: https://www.facebook.com/WasatchFrontRegionalCouncil/
            target: _blank
          - icon: twitter-x
            text: X (Twitter)
            href: https://twitter.com/wasatchcouncil/
            target: _blank
          - icon: instagram
            text: Instagram
            href: https://www.instagram.com/wasatchfrontregionalcouncil/
            target: _blank
          - icon: linkedin
            text: LinkedIn
            href: https://www.linkedin.com/company/wasatch-front-regional-council/
            target: _blank
          - icon: youtube
            text: YouTube
            href: https://www.youtube.com/user/wfrcvideo/
            target: _blank
    tools:
      - icon: github
        menu:
          - text: Source Code
            href: https://github.com/WFRCAnalytics/WF-TDM-Calibration
            target: _blank
          - text: Report a Bug
            href: https://github.com/WFRCAnalytics/WF-TDM-Calibration/issues/new
            target: _blank
  # WFRC org-wide footer, copied from wfrc-shared.yml (see note above on why
  # it's copied rather than imported). Right column kept WFRC's own
  # Contact/License links (absolute URLs -- no local pages needed here).
  page-footer:
    left: "© 2025 [Wasatch Front Regional Council](https://wfrc.utah.gov/)"
    center:
      - icon: github
        href: https://github.com/WFRCAnalytics/
        aria-label: GitHub
        target: _blank
      - icon: facebook
        href: https://www.facebook.com/WasatchFrontRegionalCouncil/
        aria-label: Facebook
        target: _blank
      - icon: twitter-x
        href: https://twitter.com/wasatchcouncil/
        aria-label: X (Twitter)
        target: _blank
      - icon: instagram
        href: https://www.instagram.com/wasatchfrontregionalcouncil/
        aria-label: Instagram
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/company/wasatch-front-regional-council/
        aria-label: LinkedIn
        target: _blank
      - icon: youtube
        href: https://www.youtube.com/user/wfrcvideo/
        aria-label: YouTube
        target: _blank
    right:
      - text: Contact
        aria-label: Contact
        href: https://wfrcanalytics.github.io/contact/
        target: _blank
      - text: License
        aria-label: License
        href: https://wfrcanalytics.github.io/license/
        target: _blank

format:
  html:
    css: styles.css
    # Restated explicitly (not just relying on the extension's own defaults)
    # since testing showed page-layout was resolving to "article" here
    # rather than the extension's declared "full".
    page-layout: full
    # Quarto splits this value across several grid margin tracks rather than
    # using it as the docked sidebar's literal rendered width (measured via
    # headless-browser bounding box: rendered width = 25.5px + 0.8 * this
    # value). 406px was chosen empirically to land the actual on-screen
    # sidebar at ~350px -- re-measure and adjust if this stops holding after
    # a Quarto/extension upgrade.
    grid:
      sidebar-width: 406px

# specify kernel to use to render jupyter notebooks (must match the local env name)
jupyter: wftdm-docs

# false, not auto: every report page must recompute from whatever calib runs
# are currently under runs/ (see report/README.md). freeze: auto only
# invalidates its cache when a .qmd's own source text changes -- it has no
# way to know a new calibration run's data landed under runs/, so it was
# silently serving stale pre-run results after `tdmcalib run` even though
# postprocess reported a successful render. report/preprocess/'s parquet
# cache already covers the expensive per-run data loading, so this doesn't
# reintroduce the cost freeze was meant to avoid.
freeze: false
