name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # required — without this, tdm/ is checked out empty

      - name: Show pinned TDM version
        run: git -C tdm log -1 --oneline

