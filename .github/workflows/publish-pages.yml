name: Publish calibration reports to GitHub Pages

# Reports are rendered locally (Quarto needs the gitignored outputs/ data, which
# isn't available to this runner) and the rendered docs/ folder is committed.
# This workflow just publishes whatever docs/ contains on push to main.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload docs as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # deploy-pages queries the Artifacts API for the artifact just uploaded
      # above; that API lags the upload by a few seconds to ~a minute, which
      # otherwise intermittently fails deploy-pages with "No artifacts named
      # github-pages were found" even though the artifact exists (seen on
      # 2026-11-24's C84 publish, twice).
      - name: Wait for artifact metadata to propagate
        run: sleep 30

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
